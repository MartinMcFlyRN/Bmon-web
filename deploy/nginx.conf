# Bmon-web behind nginx + PHP-FPM. Assumes the code in /opt/bmon-web.

server {
    listen 80;
    listen [::]:80;
    server_name bmon.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bmon.example.com;

    ssl_certificate     /etc/letsencrypt/live/bmon.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bmon.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Only public/ is exposed: src/, templates/, config/ are outside the web root.
    root /opt/bmon-web/public;
    index index.php;

    client_max_body_size 40m;   # Agent → Installer uploads the Monit binary
    server_tokens off;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # The front controller is the only PHP file that is executed.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/bmon-web.sock;
    }

    location ~ \.php$ { return 404; }
    location ~ /\.    { deny all; }
}

