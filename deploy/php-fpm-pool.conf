; Dedicated PHP-FPM pool for Bmon-web.
; Debian/Ubuntu: /etc/php/8.x/fpm/pool.d/bmon-web.conf

[bmon-web]
user = bmon-web
group = bmon-web

listen = /run/php/bmon-web.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 1000

env[BMON_WEB_CONFIG] = /etc/bmon-web/config.php

php_admin_value[session.save_path] = /var/lib/bmon-web/sessions
php_admin_value[open_basedir] = /opt/bmon-web:/etc/bmon-web/config.php:/var/lib/bmon-web:/tmp
php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/bmon-web/php-error.log
php_admin_value[memory_limit] = 128M
